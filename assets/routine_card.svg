<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcba4" />
      <stop offset="100%" stop-color="#8b5a2b" />
    </linearGradient>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Base background with gradient and grid -->
  <rect width="300" height="130" fill="url(#bg)" stroke="#ffffff" stroke-width="1" />
  <rect width="300" height="130" fill="url(#grid)" />
  
  <!-- Top bar for UI effect -->
  <rect width="300" height="20" fill="#ffffff" opacity="0.2" />
  <text x="10" y="14" font-family="Courier, monospace" font-size="10" fill="#ffffff" font-weight="bold" letter-spacing="1">routine.exe</text>
  <rect x="265" y="5" width="10" height="10" fill="#ffffff" opacity="0.4" />
  <rect x="280" y="5" width="10" height="10" fill="#ffffff" opacity="0.7" />
  <text x="15" y="45" font-family="Courier, monospace" font-size="12" fill="#ffffff" font-weight="bold">> DAILY ROUTINE</text>
  <text x="15" y="67" font-family="Courier, monospace" font-size="12" fill="#ffffff" font-weight="bold">04:00 AM | wake up.</text>
  <text x="15" y="89" font-family="Courier, monospace" font-size="12" fill="#ffffff" font-weight="bold">04:05 AM | stare into void.</text>
  <text x="15" y="111" font-family="Courier, monospace" font-size="12" fill="#ffffff" font-weight="bold">04:10 AM | redesign void.</text>
  <text x="15" y="133" font-family="Courier, monospace" font-size="9" fill="#ffffff" opacity="0.6" font-style="italic">jk i dont wakeup at 4am thats when i sleep</text>
</svg>